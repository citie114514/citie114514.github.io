name: Build and Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install gems
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Build site
        run: bundle exec jekyll build

      # 直接发布到 site 分支，由 Pages 以 legacy 模式提供。
      # 不走 upload-pages-artifact / deploy-pages：这两个 action 声明 Node 20，
      # 被强制跑在 Node 24 上后产物名解析偶发失败
      # （Error: No artifacts named "github-pages" were found）。
      - name: Deploy to site branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: site
          cname: 131566.xyz
          force_orphan: false
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
